name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Secrets into Config
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i "s|aiApiKey: \".*\"|aiApiKey: \"${{ secrets.GEMINI_API_KEY }}\"|g" js/config.js
          fi
          if [ -n "${{ secrets.GEMINI_MODEL }}" ]; then
            sed -i "s|aiModel: \".*\"|aiModel: \"${{ secrets.GEMINI_MODEL }}\"|g" js/config.js
          fi
          if [ -n "${{ secrets.APPS_SCRIPT_URL }}" ]; then
            sed -i "s|appsScriptUrl: \".*\"|appsScriptUrl: \"${{ secrets.APPS_SCRIPT_URL }}\"|g" js/config.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
